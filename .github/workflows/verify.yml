name: verify

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-bookworm
        env:
          POSTGRES_DB: gamecrafter_test
          POSTGRES_USER: gamecrafter
          POSTGRES_PASSWORD: gamecrafter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gamecrafter -d gamecrafter_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      GAMECRAFTER_DATABASE_URL: postgresql+psycopg://gamecrafter:gamecrafter_test@127.0.0.1:5432/gamecrafter_test
      GAMECRAFTER_TEST_DATABASE_URL: postgresql+psycopg://gamecrafter:gamecrafter_test@127.0.0.1:5432/gamecrafter_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format --check src tests apps/api apps/worker migrations
      - run: python -m ruff check src tests apps/api apps/worker migrations
      - run: python -m alembic upgrade head
      - run: python -m alembic downgrade 20260728_0001
      - run: python -m alembic upgrade head
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:web
      - run: pnpm test:web
      - run: pnpm build:web
