name: verify

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-bookworm@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
        env:
          POSTGRES_DB: gamecrafter_test
          POSTGRES_USER: gamecrafter
          POSTGRES_PASSWORD: gamecrafter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gamecrafter -d gamecrafter_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      GAMECRAFTER_DATABASE_URL: postgresql+psycopg://gamecrafter:gamecrafter_test@127.0.0.1:5432/gamecrafter_test
      GAMECRAFTER_TEST_DATABASE_URL: postgresql+psycopg://gamecrafter:gamecrafter_test@127.0.0.1:5432/gamecrafter_test
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m ruff format --check src tests apps/api apps/worker migrations scripts
      - run: python -m ruff check src tests apps/api apps/worker migrations scripts
      - run: python -m alembic upgrade head
      - run: python -m alembic downgrade 20260728_0001
      - run: python -m alembic upgrade head
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:web
      - run: pnpm test:web
      - run: pnpm build:web
